# Releases on their own: bump "version" in mygo.json (and add its section to
# CHANGELOG.md), push to main, and this workflow tags v<version>, builds everything into a
# draft release and publishes it once every part is there. Installed desktop apps then
# update to it. Pushes that keep the version, or whose tag exists, release nothing.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency: { group: release, cancel-in-progress: false }
env:
  # Crash reports of official builds (a Sentry DSN only lets clients send events).
  SENTRY_DSN: https://4c94bbfd83f6cda9d674dd7c4930ac6b@o325852.ingest.us.sentry.io/4512390051135488
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        env: { HAS_KEY: "${{ secrets.MYGO_UPDATER_PRIVATE_KEY != '' }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(jq -r .version mygo.json)
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # A release whose run failed stays a draft: build it again into the same draft.
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
              echo "$tag is still a draft; building it again"
              echo "release=true" >> "$GITHUB_OUTPUT"; echo "resume=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "$tag exists; nothing to release"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(jq -r '.updates.publicKey // ""' mygo.json)" = "" ] || [ "$HAS_KEY" != true ]; then
            echo "::warning::not releasing $tag: mygo.json needs updates.publicKey and the repository the MYGO_UPDATER_PRIVATE_KEY secret"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! grep -qE "^## \[?$v\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $v' section"; exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Tag and create the draft release
        if: steps.v.outputs.release == 'true' && steps.v.outputs.resume != 'true'
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.v.outputs.tag }}", V: "${{ steps.v.outputs.version }}" }
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          awk -v v="$V" '/^## /{p = ($0 ~ "^## \\[?" v "\\]?([ ]|$)")} p' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$TAG" --draft --verify-tag --title "Healthfolio $V" --notes-file notes.md

  binaries:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ needs.prepare.outputs.tag }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with: { args: release --clean --skip=publish }
      - name: Upload to the draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ needs.prepare.outputs.tag }}" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber

  docker:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.tag }}" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The image keeps its first name after the repository became healthfolio-server,
          # so docker pull and existing compose files keep getting new versions.
          images: ghcr.io/herosizy/healthsync-server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            SENTRY_DSN=${{ env.SENTRY_DSN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  desktop:
    # The desktop app for Windows and Linux, packaged by MyGo with signed self-updates
    # (mygo.json "updates"). macOS is desktop-macos, below.
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    name: desktop ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time: each build merges its lines into the release's SHA256SUMS, and two
      # uploading it at once fail with "already exists".
      max-parallel: 1
      matrix:
        include:
          - { name: Windows, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.tag }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_LDFLAGS: >-
            -X github.com/herosizy/healthsync-server/server.version=${{ needs.prepare.outputs.version }}
            -X github.com/herosizy/healthsync-server/internal/telemetry.dsn=${{ env.SENTRY_DSN }}
        # first the WebAssembly dashboard that the app's server embeds (server/webapp)
        run: |
          sh scripts/build-web.sh
          go tool mygo build -platform "${{ matrix.platform }}" -upload

  desktop-macos:
    # The macOS app, signed with the Developer ID in mygo.json and notarized, on a GitHub-hosted
    # Mac. The certificate and the notary key are secrets of the environment "release", which
    # waits for the owner's approval in Actions before this job may read them: a release that
    # nobody approves builds no macOS app and is not published. After the other desktop builds,
    # which upload to the same SHA256SUMS.
    needs: [prepare, desktop]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-26
    environment: release
    # Apple's notary service can take most of an hour for an account's first submissions.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.tag }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Temporary signing keychain
        # A keychain of this run only, with a random password: the Developer ID (.p12) for
        # codesign, and the notarytool profile healthfolio-notary (an App Store Connect API
        # key). It is the default keychain, so codesign and notarytool find them without
        # asking, and it is deleted at the end of the job.
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for v in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER; do
            [ -n "$(printenv $v)" ] || { echo "::error::The release environment has no $v secret"; exit 1; }
          done
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
          xcrun notarytool store-credentials healthfolio-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application" ||
            { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_LDFLAGS: >-
            -X github.com/herosizy/healthsync-server/server.version=${{ needs.prepare.outputs.version }}
            -X github.com/herosizy/healthsync-server/internal/telemetry.dsn=${{ env.SENTRY_DSN }}
        run: |
          sh scripts/build-web.sh
          go tool mygo build -platform "darwin/arm64,darwin/amd64" -upload
      - name: Delete the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

  publish:
    needs: [prepare, binaries, docker, desktop, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release, which installed apps update to
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
