name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Web dashboard (WebAssembly), embedded by the server
        run: sh scripts/build-web.sh
      - run: go vet ./...
      - run: go test -race ./...
      - name: Desktop app builds for every platform
        run: |
          for p in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/healthsync
          done
      - name: Browser preview builds
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/healthsync-preview
